name: Build & Deploy AI-SDLC Prompts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serializa por rama: los deploys de main no se cancelan entre sí, pero los
# runs de validacion de un mismo PR se cancelan al llegar un push mas reciente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ============================================================
#  DEPENDENCIA build -> deploy-pages -> deploy-gcp
#
#  Los 3 jobs corren en el MISMO workflow run y deploy-pages/deploy-gcp
#  declaran `needs: build` / `needs: [build, deploy-pages]`. GitHub
#  Actions NO ejecuta un job cuyo `needs` no haya terminado en success:
#  si CUALQUIER paso de `build` falla (build.py, verify_clean.py,
#  extract_vars.py o pytest), el job `build` termina en failure y
#  deploy-pages/deploy-gcp se saltan automaticamente (no corren, no hay
#  "green" parcial). No hace falta un `if` adicional para esto: es el
#  comportamiento por defecto de `needs`. El `if` que sí llevan
#  deploy-pages/deploy-gcp filtra ademas por evento (push a main, no PR),
#  para que un PR se valide sin desplegar.
# ============================================================
jobs:

# ============================================================
#  JOB 1 - BUILD + VALIDACION (los 5 gates obligatorios)
#  Corre en push a main y en cada PR. Si cualquiera de los 5 falla,
#  el job termina en failure y ningun deploy avanza (ver dependencia
#  arriba). Los 5 gates, en orden:
#    1. build.py         -> regenera index.html desde los .md fuente
#    2. verify_clean.py  -> ninguna formula ES/EN queda en el prompt copiable
#    3. extract_vars.py  -> ningun placeholder generico invalido ([NOMBRE], [TIPO]...)
#    4. test_variables_runtime.js -> ejecuta el JS generado (VM real) y
#       valida resolvePrompt/copyPromptLang/persistencia de proyectos
#    5. pytest -q        -> suite de contrato (build, i18n, variables, etc.)
#
#  Aparte corre el job `e2e` (Playwright, navegador real) EN PARALELO a
#  deploy-pages/deploy-gcp: es informativo, no bloqueante (ver ese job).
# ============================================================
  build:
    runs-on: ubuntu-latest
    outputs:
      card_count: ${{ steps.card_count.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build index.html
        env:
          # Valores publicos de Paddle. Los PR siempre generan sandbox; main
          # solo genera checkout live cuando las variables se configuran.
          PADDLE_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && vars.PADDLE_ENVIRONMENT || 'sandbox' }}
          PADDLE_CLIENT_TOKEN: ${{ github.ref == 'refs/heads/main' && vars.PADDLE_CLIENT_TOKEN || 'PENDIENTE_CONFIGURAR' }}
          PADDLE_PRICE_ID: ${{ github.ref == 'refs/heads/main' && vars.PADDLE_PRICE_ID || 'PENDIENTE_CONFIGURAR' }}
        run: python build.py

      - name: QA gate - validate prompts
        run: python verify_clean.py

      - name: QA gate - audit placeholders
        run: python extract_vars.py

      - name: QA gate - JS runtime tests
        run: node tests/js/test_variables_runtime.js

      - name: Run tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest tests/ -q

      # Umbral del smoke test de produccion (job deploy-gcp) derivado del
      # build real, no un numero fijo: evita que vuelva a quedar obsoleto
      # (paso de >=44 a 75 prompts sin que nadie actualizara el smoke test).
      - name: Compute expected card count
        id: card_count
        run: |
          COUNT=$(grep -c 'class="card"' index.html)
          echo "Cards esperadas (ES+EN): $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Prepare dist/
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          # Bug real corregido (auditoría de UX): el botón principal de la
          # landing ("Explorar prompts") enlaza a /app, ruteado client-side
          # por JS leyendo location.pathname (ver index.html). En
          # producción (GCP), nginx_prompts.conf hace
          # `try_files $uri $uri/ /index.html` y /app sirve index.html sin
          # problema. GitHub Pages no soporta ese rewrite -- sin un
          # 404.html, /app devolvía un 404 real de GitHub y el botón
          # principal quedaba roto en ese entorno. GitHub Pages sirve
          # 404.html (con status 404) para cualquier ruta no encontrada,
          # y como es una copia idéntica de index.html, el mismo JS de
          # ruteo client-side toma el control y muestra la app con
          # normalidad -- truco estándar de SPA en GitHub Pages.
          cp index.html dist/404.html
          cp precios.html dist/precios.html
          cp terminos.html dist/terminos.html
          cp privacidad.html dist/privacidad.html
          cp reembolsos.html dist/reembolsos.html
          cp robots.txt dist/robots.txt
          cp sitemap.xml dist/sitemap.xml

      - name: Upload artifact (shared by Pages and GCP)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

# ============================================================
#  JOB 1B - E2E NAVEGADOR (Playwright) - NO BLOQUEANTE
#  No es uno de los 5 gates obligatorios: corre en paralelo, informa
#  resultado en el check run, pero continue-on-error a nivel de job evita
#  que un fallo (o flakiness de navegador) tumbe el workflow. deploy-pages
#  y deploy-gcp solo declaran `needs: build`, nunca `needs: e2e`, así que
#  esta suite jamás bloquea un deploy aunque falle.
# ============================================================
  e2e:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build index.html
        run: python build.py

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: E2E navegador (no bloqueante)
        run: python -m pytest tests/e2e/test_browser_e2e.py -v

# ============================================================
#  JOB 1C - SERVIDOR MCP (mcp-server/) - NO BLOQUEANTE
#  El servidor MCP no forma parte del sitio desplegado (index.html), asi
#  que igual que `e2e` no bloquea deploy-pages/deploy-gcp (solo declaran
#  `needs: build`) -- pero corre en cada PR para no dejar que se rompa
#  en silencio.
# ============================================================
  mcp-server-test:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

# ============================================================
#  JOB 1D - SUPABASE EDGE FUNCTION (webhook de Paddle)
#  Solo en push a main. Independiente de deploy-pages/deploy-gcp (no hay
#  dependencia de orden entre desplegar el sitio estatico y la funcion).
#  Secreto requerido en el environment 'production':
#    SUPABASE_ACCESS_TOKEN -> token personal de Supabase (Account Settings
#    > Access Tokens), NO la anon key ni la service role key.
#  El secreto PADDLE_WEBHOOK_SECRET se configura UNA SOLA VEZ directo en
#  Supabase (Edge Functions > paddle-webhook > Secrets), no en este
#  workflow -- no cambia en cada deploy, y así nunca pasa por GitHub.
# ============================================================
  deploy-supabase-function:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy paddle-webhook Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy paddle-webhook \
            --project-ref sqdzoreqfatpdainlhrm \
            --no-verify-jwt

# ============================================================
#  JOB 2 - GITHUB PAGES  (staging / ambiente de pruebas)
#  Solo en push a main; los PR no despliegan.
# ============================================================
  deploy-pages:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (staging)
        id: deployment
        uses: actions/deploy-pages@v4

# ============================================================
#  JOB 3 - GCP  (produccion)
#  Avanza solo si build + deploy-pages pasaron (push a main).
#  Secrets del environment 'production':
#    GCP_SSH_KEY   -> clave privada RSA
#    GCP_KNOWN_HOST -> fingerprint ECDSA del servidor
#    GCP_HOST, GCP_USER, GCP_PORT, GCP_DEPLOY_PATH
# ============================================================
  deploy-gcp:
    needs: [build, deploy-pages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://prompts.lionsystems.com.mx
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Configure SSH
        env:
          GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
          GCP_KNOWN_HOST: ${{ secrets.GCP_KNOWN_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$GCP_KNOWN_HOST" >> ~/.ssh/known_hosts
          printf '%s\n' "$GCP_SSH_KEY" > ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key

      - name: Transfer to GCP staging path
        env:
          H: ${{ secrets.GCP_HOST }}
          U: ${{ secrets.GCP_USER }}
          P: ${{ secrets.GCP_PORT }}
        run: |
          scp -P "$P" -i ~/.ssh/gcp_key -o BatchMode=yes \
              dist/index.html "${U}@${H}:/home/${U}/index.html.new"
          scp -P "$P" -i ~/.ssh/gcp_key -o BatchMode=yes \
              dist/precios.html "${U}@${H}:/home/${U}/precios.html.new"
          scp -P "$P" -i ~/.ssh/gcp_key -o BatchMode=yes \
              dist/terminos.html "${U}@${H}:/home/${U}/terminos.html.new"
          scp -P "$P" -i ~/.ssh/gcp_key -o BatchMode=yes \
              dist/privacidad.html "${U}@${H}:/home/${U}/privacidad.html.new"
          scp -P "$P" -i ~/.ssh/gcp_key -o BatchMode=yes \
              dist/reembolsos.html "${U}@${H}:/home/${U}/reembolsos.html.new"
          scp -P "$P" -i ~/.ssh/gcp_key -o BatchMode=yes \
              dist/robots.txt "${U}@${H}:/home/${U}/robots.txt.new"
          scp -P "$P" -i ~/.ssh/gcp_key -o BatchMode=yes \
              dist/sitemap.xml "${U}@${H}:/home/${U}/sitemap.xml.new"

      - name: Atomic replace in production dir
        env:
          H: ${{ secrets.GCP_HOST }}
          U: ${{ secrets.GCP_USER }}
          P: ${{ secrets.GCP_PORT }}
          D: ${{ secrets.GCP_DEPLOY_PATH }}
        run: |
          CMD="set -e"
          CMD="${CMD}; sudo cp /home/${U}/index.html.new ${D}/index.html"
          CMD="${CMD}; sudo cp /home/${U}/precios.html.new ${D}/precios.html"
          CMD="${CMD}; sudo cp /home/${U}/terminos.html.new ${D}/terminos.html"
          CMD="${CMD}; sudo cp /home/${U}/privacidad.html.new ${D}/privacidad.html"
          CMD="${CMD}; sudo cp /home/${U}/reembolsos.html.new ${D}/reembolsos.html"
          CMD="${CMD}; sudo cp /home/${U}/robots.txt.new ${D}/robots.txt"
          CMD="${CMD}; sudo cp /home/${U}/sitemap.xml.new ${D}/sitemap.xml"
          CMD="${CMD}; sudo chown www-data:www-data ${D}/index.html ${D}/precios.html ${D}/terminos.html ${D}/privacidad.html ${D}/reembolsos.html ${D}/robots.txt ${D}/sitemap.xml"
          CMD="${CMD}; sudo chmod 644 ${D}/index.html ${D}/precios.html ${D}/terminos.html ${D}/privacidad.html ${D}/reembolsos.html ${D}/robots.txt ${D}/sitemap.xml"
          CMD="${CMD}; rm -f /home/${U}/index.html.new /home/${U}/precios.html.new /home/${U}/terminos.html.new /home/${U}/privacidad.html.new /home/${U}/reembolsos.html.new /home/${U}/robots.txt.new /home/${U}/sitemap.xml.new"
          CMD="${CMD}; echo DEPLOY_PROD_OK"
          CMD="${CMD}; stat ${D}/index.html"
          ssh -p "$P" -i ~/.ssh/gcp_key -o BatchMode=yes "${U}@${H}" "$CMD"

      - name: Smoke test GCP production
        env:
          EXPECTED: ${{ needs.build.outputs.card_count }}
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              https://prompts.lionsystems.com.mx)
          echo "HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || { echo "ERROR: HTTP $STATUS"; exit 1; }
          COUNT=$(curl -s --max-time 20 https://prompts.lionsystems.com.mx \
              | grep -c 'class="card"' || true)
          echo "Cards en produccion: $COUNT (esperadas del build: $EXPECTED)"
          [ "$COUNT" -ge "$EXPECTED" ] || { echo "ERROR: esperadas >=$EXPECTED, encontradas $COUNT"; exit 1; }
          echo "SMOKE_OK: $COUNT cards verificadas"
          ROBOTS_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              https://prompts.lionsystems.com.mx/robots.txt)
          [ "$ROBOTS_STATUS" = "200" ] || { echo "ERROR: robots.txt HTTP $ROBOTS_STATUS"; exit 1; }
          SITEMAP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              https://prompts.lionsystems.com.mx/sitemap.xml)
          [ "$SITEMAP_STATUS" = "200" ] || { echo "ERROR: sitemap.xml HTTP $SITEMAP_STATUS"; exit 1; }
          echo "SMOKE_OK: robots.txt y sitemap.xml verificados"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/gcp_key
