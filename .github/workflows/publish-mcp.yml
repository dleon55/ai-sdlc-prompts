# Publica el servidor MCP en npm y lo registra en el registro oficial de MCP
# (registry.modelcontextprotocol.io) al crear un tag `mcp-v*`.
#
# Por qué por tag y no en cada push a main: publicar es irreversible (una
# versión de npm no se puede reemplazar, solo deprecar). El tag es el acto
# deliberado; main sigue siendo el flujo normal de desarrollo.
#
# Autenticación: trusted publishing (OIDC). No hay token de npm en el repo:
# npm confía en este workflow (`publish-mcp.yml`, environment `production`)
# según lo configurado en npmjs.com → paquete → Settings → Trusted Publisher.
# El publicador tiene permiso de `npm publish`: el tag publica directamente,
# con procedencia firmada, sin aprobación manual. Ver docs/publicar-mcp.md.
name: Publicar servidor MCP

on:
  push:
    tags:
      - "mcp-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # El trusted publisher de npm está atado a este environment: si el job no
    # lo declara, npm rechaza la identidad OIDC.
    environment:
      name: production
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) y procedencia de npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing exige npm >= 11.5.1 (se pide >= 11.15.0, que también
      # permite `npm stage publish` si algún día se vuelve a la aprobación manual).
      # Se fija la versión en vez de confiar en la que trae Node.
      - name: Actualizar npm para trusted publishing
        run: |
          npm install -g npm@11
          npm -v
          node -e "const [a,b]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&b<15)) { console.error('::error::npm '+process.argv[1]+' es menor que 11.15.0'); process.exit(1) }" "$(npm -v)"

      - name: Instalar dependencias
        working-directory: mcp-server
        run: npm ci

      # El paquete lleva los 112 prompts embebidos (data/prompts-full.json,
      # generado por build.py). Si alguien publica sin regenerarlo, se
      # distribuye un catálogo viejo sin que nada avise.
      - name: Regenerar y verificar que los datos están al día
        run: |
          python build.py
          if ! git diff --quiet -- mcp-server/data/prompts-full.json; then
            echo "::error::mcp-server/data/prompts-full.json está desactualizado."
            echo "Corre 'python build.py' y commitea el resultado antes de taggear."
            git diff --stat -- mcp-server/data/prompts-full.json
            exit 1
          fi

      - name: Pruebas
        working-directory: mcp-server
        run: npm test

      # No publicar con vulnerabilidades altas conocidas. Un producto sobre
      # gobernanza que distribuye dependencias vulnerables se desmiente solo.
      #
      # Bloquea solo en `high`/`critical` a propósito: un aviso nuevo de
      # severidad media no debe impedir publicar un cambio de contenido, pero
      # sí debe verse. Ver docs/publicar-mcp.md para el análisis de alcance.
      - name: Auditoría de dependencias
        working-directory: mcp-server
        run: npm audit --audit-level=high

      # El tag manda: si dice mcp-v1.2.0, el paquete debe ser 1.2.0. Publicar
      # una versión distinta de la taggeada hace imposible saber después qué
      # código quedó en npm.
      - name: Verificar que el tag coincide con la versión del paquete
        working-directory: mcp-server
        run: |
          TAG="${GITHUB_REF_NAME#mcp-v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::el tag ($TAG) no coincide con package.json ($PKG)"
            exit 1
          fi
          # server.json describe la misma versión en el registro oficial, dos veces
          # (la del servidor y la del paquete npm): las tres tienen que coincidir.
          for V in $(node -p "const s=require('./server.json'); [s.version, s.packages[0].version].join(' ')"); do
            if [ "$V" != "$PKG" ]; then
              echo "::error::server.json declara $V y package.json $PKG"
              exit 1
            fi
          done

      - name: Previsualizar el contenido del paquete
        working-directory: mcp-server
        run: npm pack --dry-run

      # Con trusted publishing npm firma la procedencia solo; --provenance lo
      # deja explícito.
      - name: Publicar
        working-directory: mcp-server
        run: npm publish --provenance --access public

      # --- Registro oficial de MCP -------------------------------------------
      # El registro solo guarda metadatos y comprueba que el paquete de npm
      # declare el mismo `mcpName` que server.json. La identidad es la OIDC de
      # este workflow: el espacio io.github.dleon55/* pertenece a este dueño de
      # GitHub, sin tokens ni secretos. Se fija la versión del publicador y se
      # verifica su firma Sigstore antes de ejecutarlo.
      - name: Instalar cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Descargar y verificar mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      # npm tarda en exponer una versión recién publicada; el registro la
      # consulta para validar `mcpName`, así que se espera a que aparezca.
      - name: Esperar a que npm sirva la versión publicada
        working-directory: mcp-server
        run: |
          PKG=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            [ "$(npm view "ai-sdlc-prompts-mcp@$PKG" mcpName 2>/dev/null)" = "io.github.dleon55/ai-sdlc-prompts" ] && exit 0
            sleep 10
          done
          echo "::error::npm no muestra ai-sdlc-prompts-mcp@$PKG con su mcpName"
          exit 1

      - name: Registrar en el registro oficial de MCP
        working-directory: mcp-server
        run: |
          ../mcp-publisher login github-oidc
          ../mcp-publisher publish
