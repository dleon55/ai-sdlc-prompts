# Postgres para desarrollo local. En produccion el backend usa el
# PostgreSQL nativo de la VM (base ai_sdlc_pro, rol ai_sdlc_backend).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_sdlc_dev
      POSTGRES_PASSWORD: dev_password_local_only
      POSTGRES_DB: ai_sdlc_pro
    ports:
      - "5432:5432"
    volumes:
      - ai_sdlc_pg_data:/var/lib/postgresql/data

volumes:
  ai_sdlc_pg_data:
