# /etc/nginx/sites-available/prompts.lionsystems.com.mx
# Desplegado: 2026-04-10
# Servidor: GCP 34.51.112.6:2288
# SSL: Let's Encrypt (certbot), expira 2026-07-10, renovacion automatica

server {
    server_name prompts.lionsystems.com.mx;

    root /var/www/prompts;
    index index.html;

    # Sitio estatico SPA (self-contained)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: fuerza HTTPS en visitas subsecuentes; sin esto, un atacante en
    # la red (MITM en Wi-Fi público) puede interceptar la primera petición
    # HTTP antes del redirect 80->443 de abajo (SSL-stripping).
    # HSTS con max-age corto y SIN preload, a proposito.
    #
    # HSTS es una puerta de un solo sentido: una vez que un navegador recibe
    # la cabecera, rechaza HTTP para este dominio durante todo el max-age
    # AUNQUE se quite del servidor. Con los 63072000 segundos (2 anios) y el
    # `preload` que tenia antes este archivo, un certificado vencido o una
    # necesidad futura de servir por HTTP dejaba el sitio inalcanzable sin
    # forma practica de revertir.
    #
    # 86400 = 1 dia: protege igual contra el ataque que HSTS previene
    # (degradar la primera visita a HTTP), y si algo sale mal se corrige en
    # 24 horas. Cuando lleve semanas estable, subirlo por pasos --
    # 1 dia -> 1 semana -> 1 anio -- y solo entonces valorar `preload`, que
    # ademas exige enviarlo a hstspreload.org y sacarlo de ahi tarda meses.
    add_header Strict-Transport-Security "max-age=86400" always;
    # CSP: permite scripts de GTM, del SDK de Supabase (registro de usuarios,
    # ver docs/auth-setup.md) e imágenes de Lionsystems. unsafe-inline
    # requerido para CSS/JS embebidos. connect-src incluye el dominio del
    # proyecto de Supabase porque, ya con sesión iniciada, el SDK hace
    # peticiones fetch/XHR reales a su API (auth y REST) -- sin esto el
    # script cargaría pero cada llamada quedaría bloqueada por CSP igual.
    #
    # Bug real corregido (mismo patrón que el de Supabase): al agregar el
    # checkout de Paddle en /precios.html (docs/paddle-integration.md), el
    # botón "Suscribirme" no hacía nada -- el script cdn.paddle.com quedaba
    # bloqueado en silencio por script-src, sin ningún aviso visible para
    # el usuario (solo aparece en la consola del navegador). Se agrega
    # cdn.paddle.com a script-src, y *.paddle.com a connect-src (llamadas
    # fetch/XHR del checkout a la API de Paddle) y frame-src (el checkout
    # de Paddle se abre como iframe, no como script puro -- sin frame-src
    # el iframe también quedaría bloqueado aunque el script sí cargara).
    #
    # Segundo hallazgo real (mismo despliegue): Paddle carga su propia hoja
    # de estilos desde un subdominio DISTINTO al del script en modo Sandbox
    # (sandbox-cdn.paddle.com, no cdn.paddle.com) -- confirmado en la
    # consola del navegador tras el primer fix. Se cambia a un comodín
    # *.paddle.com en script-src y style-src en vez de listar cada
    # subdominio uno por uno, porque Paddle usa nombres distintos entre
    # Sandbox y producción y no está documentado exhaustivamente cuáles.
    # Sobre img-src y Google Analytics: gtag inyecta en tiempo de ejecucion
    # un pixel de remarketing a https://www.google.<tld>/ads/ga-audiences.
    # NO aparece en el codigo fuente -- buscarlo en el repositorio da cero
    # ocurrencias y lleva a concluir que el origen sobra. Se verifico en la
    # consola de produccion que se pide de verdad, con el tid G-C5JKYNZ62F.
    #
    # El TLD depende del pais del visitante: .com.mx cubre a Mexico, no a
    # quien entre desde otro pais. Antes de ampliar la lista conviene decidir
    # si ese pixel se quiere: desactivar Google Signals en GA lo elimina de
    # raiz y es la opcion mas limpia y mas respetuosa con la privacidad.
    #
    # Se quitaron dos origenes que SI estaban de mas, verificado en el
    # codigo y en el runtime: avatars.githubusercontent.com (la app muestra
    # el user_name, nunca el avatar) y www.lionsystems.com.mx (era el icono,
    # ahora servido desde el propio origen).
    add_header Content-Security-Policy "default-src 'self'; style-src 'unsafe-inline' https://fonts.googleapis.com https://*.paddle.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.jsdelivr.net https://*.paddle.com; img-src 'self' data: https://www.googletagmanager.com https://www.google.com.mx; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://stats.g.doubleclick.net https://sqdzoreqfatpdainlhrm.supabase.co https://*.paddle.com; frame-src https://*.paddle.com; object-src 'none'; frame-ancestors 'none'" always;
    # No hay versionado/hash en el nombre de index.html (se regenera in-place
    # en cada deploy), así que no se usa un max-age largo -- eso serviría
    # contenido desactualizado hasta que expire. no-cache fuerza revalidación
    # con ETag/Last-Modified (que nginx ya envía por defecto) en cada visita:
    # el navegador obtiene un 304 barato si el archivo no cambió, y el
    # contenido nuevo se sirve de inmediato tras un deploy, sin esperar TTL.
    add_header Cache-Control "no-cache" always;

    # Compresion
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json text/plain;

    access_log /var/log/nginx/prompts.access.log;
    error_log  /var/log/nginx/prompts.error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/prompts.lionsystems.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prompts.lionsystems.com.mx/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = prompts.lionsystems.com.mx) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name prompts.lionsystems.com.mx;
    return 404;
}
